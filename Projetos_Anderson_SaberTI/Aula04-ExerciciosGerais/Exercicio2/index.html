<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovação Escolar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body class="container" style="margin-top: 20px;">

    <h1 style="text-align: center; font-size: 50px;">Verificador de Aprovação</h1>

    <form>
        <div div class="grid">
            <div class="row">

                <div class="col"
                    style="background-color: #d1d1d1; border-top-left-radius: 8px; border-bottom-left-radius: 8px;">
                    <h2 class="form-label" style="text-align: center; background-color: #c4c4c4;">Notas</h2>
                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Nota 1° Bimestre</label>
                        <input step="0.1" type="number" name="nota" class="form-control">

                    </div>

                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Nota 2° Bimestre</label>
                        <input step="0.1" type="number" name="nota" class="form-control">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Nota 3° Bimestre</label>
                        <input step="0.1" type="number" name="nota" class="form-control">

                    </div>

                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Nota 4° Bimestre</label>
                        <input step="0.1" type="number" name="nota" class="form-control">

                    </div>

                </div>

                <div class="col"
                    style="background-color: #d1d1d1; border-top-right-radius: 8px; border-bottom-right-radius: 8px;">
                    <h2 style="text-align: center; background-color: #c4c4c4;">Faltas</h2>
                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Faltas 1° Bimestre</label>
                        <input type="number" name="falta" class="form-control">

                    </div>

                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Faltas 2° Bimestre</label>
                        <input type="number" name="falta" class="form-control">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Faltas 3° Bimestre</label>
                        <input type="number" name="falta" class="form-control">

                    </div>

                    <div style="margin-bottom: 15px;">
                        <label class="form-label">Faltas 4° Bimestre</label>
                        <input type="number" name="falta" class="form-control">

                    </div>
                </div>
            </div>
        </div>
    </form>


    <button id="btnMedia" style="margin: 15px; margin-left: 0;" class="btn btn-primary">Calcular média</button>

    <input type="text" disabled class="form-control" id="media">

    <label id="aprovacao"></label>

    <script src="script.js"></script>
</body>

</html>
