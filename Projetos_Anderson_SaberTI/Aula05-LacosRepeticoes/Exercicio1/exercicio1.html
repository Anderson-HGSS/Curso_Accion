<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <h1 style="text-align: center;">Gerador de tabuada</h1>

    <p class="fw-bold">Digite o número:</p>
    <input class="form-control" type="number" name="num" id="num">
    <button id="botao" class="btn btn-dark" style="text-align: center; margin-top: 15px;">Gerar tabuada</button>

    <div style="margin-top: 15px; text-align: justify; background-color: #b1b1b162; border-color: black; border-width: 5px; border-radius: 8px; padding: 10px;">
        <p id="tabuada"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
