<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de área</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container">
    <script src="script.js"></script>


    <form style="margin-top: 25px;" onsubmit="calculaArea(); return false;">
        <h1 class="fw-bold">Cálculo Área do Circulo</h1>

        <div>
            <label for="raio">Raio:</label>
            <input placeholder="Digite o valor do raio" class="form-control" type="number" step="0.01" required id="raio">
        </div>

        <button style="margin: 15px; margin-left: 0;" class="btn btn-primary">Calcular</button>

        <div>
            <p><label for="area">A área do circulo é:</label></p>
            <input class="form-control" type="text" id="area" readonly>
        </div>

    </form>


</body>

</html>
