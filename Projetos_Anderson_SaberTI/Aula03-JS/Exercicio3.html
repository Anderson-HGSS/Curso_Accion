<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Classificação de idades</h1>

    <div>
        <label>Insira sua idade: </label>
        <input type="text" id="idade">
    </div>

    <div>
        <button id="botao">Classificar</button>
        <p id="resposta"></p>
    </div>
    
    <script>
        let botao = document.getElementById("botao");
        let resposta = document.getElementById("resposta");

        botao.addEventListener("click", function(){
            let idade = parseInt(document.getElementById("idade").value);

            if(idade <= 12 && idade >= 0){
                resposta.innerText = "Você é uma criança."
            }
            else if(idade >= 13 && idade < 18){
                resposta.innerText = "Você é uma adolescente."
            }
            else if(idade >= 18 && idade < 60){
                resposta.innerText = "Você é um adulto."
            }
            else if(idade >= 60){
                resposta.innerText = "Você é um idoso."
            }else{
                resposta.innerText = "Idade Inválida!"
            }
        })
    </script>
</body>
</html>
