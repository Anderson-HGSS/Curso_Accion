<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio css</title>

    <style>
        body{
            background-color: #ecffff;
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .titulo{
            color: rgb(82, 108, 255);
        }
        p{
            font-size: 25px;
        }
        button{
            background-color: rgb(82, 108, 255);
            width: 150px;
            height: 50px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1 class="titulo">Minha página</h1>
    <p>Este é um exemplo de uma página que está usando css</p>
    <button>Clique aqui</button>
</html>
