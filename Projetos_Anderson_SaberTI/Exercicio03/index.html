<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html+CSS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Cadastro de clientes</h1>
    <p>Preencha os campos abaixo para cadastrar um novo cliente</p>

    <form class="d-flex flex-column gap-3">
        <div>
            <label class="form-label fw-bold" for="nome-completo">Nome completo:</label>
            <input class="form-control" class="form-control" type="text" id="nome-completo" name="nome"
                placeholder="Digite o nome do cliente">
        </div>

        <div>
            <label class="form-label fw-bold" for="cpf">CPF:</label>
            <input id="cpf" class="form-control" type="text" name="cpf" placeholder="Digite o CPF">
        </div>

        <div>
            <label class="form-label fw-bold" for="email">E-mail:</label>
            <input class="form-control" id="email" type="email" name="email" placeholder="Digite o e-mail">
        </div>

        <div>
            <label class="form-label fw-bold" for="telefone">Telefone:</label>
            <input class="form-control" type="text" id="telefone" name="telefone" placeholder="Digite o telefone">
        </div>

        <div>
            <label class="form-label fw-bold" for="data-nascimento">Data de nascimento:</label>
            <input class="form-control" type="date" id="data-nascimento" name="dataNascimento">
        </div>

        <div>
            <label class="form-label fw-bold" for="endereco">Endereço</label>
            <input class="form-control" type="text" id="endereco" name="endereco" placeholder="Digite o endereço">
        </div>

        <div>
            <label class="form-label fw-bold" for="cidade">Cidade</label>
            <input class="form-control" type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
        </div>

        <div>
            <label class="form-label fw-bold" for="estado">Estado</label>
            <select class="form-select" name="estado" id="estado">
                <option value="--">--</option>
                <option value="parana">Paraná</option>
                <option value="sao_paulo">São Paulo</option>
                <option value="minas_gerais">Minas Gerais</option>
            </select>
        </div>

        <div>
            <label class="form-label fw-bold" for="tipo-cliente">Tipo de cliente:</label>
            <select class="form-select" name="tipoCliente" id="tipo-cliente">
                <option value="--">--</option>
                <option value="sao_paulo">Padrão</option>
                <option value="minas_gerais">Premium</option>
            </select>
        </div>

        <div>
            <label class="form-label fw-bold">Observações:</label>
            <textarea class="form-control" name="observacoes" placeholder="Digite alguma observação"></textarea>
        </div>

        <div>
            <button class="btn btn-primary">Cadastrar</button>
            <button class="btn btn-secondary">Limpar</button>
        </div>

    </form>




</body>

</html>
